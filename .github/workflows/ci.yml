name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dr_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DR_PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dr_platform_test
    steps:
      - uses: actions/checkout@v7
      # dr-* git deps are private; route their fetches through a read-only
      # fine-grained PAT.
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright src/dr_platform tests scripts
      - run: uv run pytest -q --junitxml=pytest-junit.xml
      # The PostgreSQL behavior suite is the merge gate; only the
      # credential-gated MotherDuck capability test may skip.
      - name: Enforce skip budget
        run: uv run python scripts/check_skip_budget.py pytest-junit.xml
