name: CI

on:
  push:
    branches: [main]
  pull_request:

# A stack restack synchronizes every downstream PR at once; without a
# concurrency group the superseded runs stay queued and starve the live ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dr_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner host has its own PostgreSQL answering on localhost:5432,
      # so a host port mapping is shadowed; connect to the service
      # container's bridge address directly.
      - name: Point tests at the postgres service container
        run: |
          postgres_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$postgres_ip"
          echo "DR_PLATFORM_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@${postgres_ip}:5432/dr_platform_test" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Fail fast with a clear message if the service database is
      # unreachable, instead of skipping the whole PostgreSQL suite.
      - name: Verify postgres connectivity
        run: |
          uv run python -c "
          import os, psycopg
          url = os.environ['DR_PLATFORM_TEST_DATABASE_URL']
          psycopg.connect(url.replace('postgresql+psycopg://', 'postgresql://', 1)).close()
          print('postgres reachable')
          "
      - run: ./pre-check.sh

  # Branch protection on main requires the exact status check context 'ci'.
  # The matrix above produces versioned contexts instead, so this aggregate
  # gate republishes a single 'ci' check that passes only when every matrix job
  # succeeded. It runs on a cheap runner (no Depot minutes).
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all matrix jobs succeeded"
