name: Release

on:
  push:
    tags: ["v*"]

# Each job opts into only the token capability it needs. In particular, the
# short-lived PyPI credential can be minted only by the publish job.
permissions: {}

jobs:
  validate:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dr_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Keep every uv invocation in pre-check.sh on the immutable registry
      # resolution selected below.
      UV_LOCKED: "1"
      UV_NO_SOURCES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The Depot host has its own PostgreSQL on localhost:5432, so connect to
      # the service container over its bridge address, as the CI workflow does.
      - name: Point tests at the postgres service container
        run: |
          postgres_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$postgres_ip"
          echo "DR_PLATFORM_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@${postgres_ip}:5432/dr_platform_test" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked registry dependency graph
        run: uv sync --locked --no-sources
      - name: Verify postgres connectivity
        run: |
          uv run python -c "
          import os, psycopg
          url = os.environ['DR_PLATFORM_TEST_DATABASE_URL']
          psycopg.connect(url.replace('postgresql+psycopg://', 'postgresql://', 1)).close()
          print('postgres reachable')
          "
      - name: Run canonical pre-publication checks
        run: ./pre-check.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      wheel_sha256: ${{ steps.verify_artifacts.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.verify_artifacts.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.12"
      - name: Verify release tag and main provenance
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python_path="$(uv python find 3.12)"
          project_version="$("$python_path" - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]

          heading = re.compile(
              rf"## {re.escape(version)} - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}"
          )
          changelog_lines = Path("CHANGELOG.md").read_text().splitlines()
          if not any(heading.fullmatch(line) for line in changelog_lines):
              raise SystemExit(
                  "CHANGELOG.md must contain an exact dated heading "
                  f"for version {version}"
              )

          print(version)
          PY
          )"
          expected_tag="v${project_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "release tag ${RELEASE_TAG} does not match project version ${project_version}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "checked-out commit does not match the tagged release commit" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "release tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "tagged release commit is not contained in origin/main" >&2
            exit 1
          fi

          echo "PROJECT_VERSION=${project_version}" >> "$GITHUB_ENV"
      - name: Build distributions without local sources
        run: uv build --no-sources
      - name: Verify distribution names and metadata
        id: verify_artifacts
        run: |
          "$(uv python find 3.12)" - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import hashlib
          import os
          import tarfile
          import zipfile

          project_name = "dr-platform"
          distribution_name = "dr_platform"
          version = os.environ["PROJECT_VERSION"]
          dist = Path("dist")
          artifacts = sorted(
              path
              for path in dist.iterdir()
              if path.is_file() and path.name != ".gitignore"
          )
          expected_wheel = dist / f"{distribution_name}-{version}-py3-none-any.whl"
          expected_sdist = dist / f"{distribution_name}-{version}.tar.gz"
          expected = {expected_wheel, expected_sdist}
          if set(artifacts) != expected:
              found = ", ".join(path.name for path in artifacts) or "none"
              raise SystemExit(f"unexpected release artifacts: {found}")

          def verify_metadata(data: bytes, artifact: Path) -> None:
              metadata = BytesParser().parsebytes(data)
              if metadata["Name"] != project_name:
                  raise SystemExit(
                      f"{artifact.name} has project name {metadata['Name']!r}"
                  )
              if metadata["Version"] != version:
                  raise SystemExit(
                      f"{artifact.name} has version {metadata['Version']!r}, "
                      f"expected {version!r}"
                  )

          with zipfile.ZipFile(expected_wheel) as wheel:
              metadata_paths = [
                  name for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit("wheel does not contain exactly one METADATA file")
              verify_metadata(wheel.read(metadata_paths[0]), expected_wheel)

          with tarfile.open(expected_sdist, "r:gz") as sdist:
              metadata_members = [
                  member for member in sdist.getmembers()
                  if member.isfile() and member.name.endswith("/PKG-INFO")
              ]
              if len(metadata_members) != 1:
                  raise SystemExit("sdist does not contain exactly one PKG-INFO file")
              metadata_file = sdist.extractfile(metadata_members[0])
              if metadata_file is None:
                  raise SystemExit("could not read sdist PKG-INFO")
              verify_metadata(metadata_file.read(), expected_sdist)

          wheel_sha256 = hashlib.sha256(expected_wheel.read_bytes()).hexdigest()
          sdist_sha256 = hashlib.sha256(expected_sdist.read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as outputs:
              outputs.write(f"wheel_sha256={wheel_sha256}\n")
              outputs.write(f"sdist_sha256={sdist_sha256}\n")

          print(
              f"verified {project_name} {version} wheel and sdist\n"
              f"wheel sha256: {wheel_sha256}\n"
              f"sdist sha256: {sdist_sha256}"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dr-platform/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify downloaded artifact hashes
        env:
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import hmac
          import os
          import string

          dist = Path("dist")
          artifacts = sorted(path for path in dist.iterdir() if path.is_file())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          if len(artifacts) != 2 or len(wheels) != 1 or len(sdists) != 1:
              found = ", ".join(path.name for path in artifacts) or "none"
              raise SystemExit(f"unexpected downloaded artifacts: {found}")

          expected_hashes = {
              wheels[0]: os.environ["EXPECTED_WHEEL_SHA256"],
              sdists[0]: os.environ["EXPECTED_SDIST_SHA256"],
          }
          for artifact, expected in expected_hashes.items():
              if len(expected) != 64 or any(
                  character not in string.hexdigits for character in expected
              ):
                  raise SystemExit(
                      f"missing or invalid expected hash for {artifact.name}"
                  )
              actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if not hmac.compare_digest(actual, expected.lower()):
                  raise SystemExit(f"hash mismatch for {artifact.name}")
              print(f"verified {artifact.name} sha256: {actual}")
          PY
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
