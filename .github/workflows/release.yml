name: Release

on:
  push:
    tags: ["v*"]

# Publishing uses PyPI Trusted Publishing (OIDC); the id-token scope is
# granted per job, so the top-level default stays read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dr-platform/
    # Trusted Publishing mints a short-lived OIDC token instead of an API
    # token, so no secret is stored; the workflow only needs to read the repo.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
