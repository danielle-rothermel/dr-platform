# Planning-stage selections for async stages and run fan-in. Their binding
# forms live in ../../../.defs/contracts.toml.

[[contracts]]
title = "Application workflows are async"
statement = """
Platform-managed pipeline stage and run completion workflows are async and \
awaited by platform wrappers. Argument derivation and ledger mutation remain \
synchronous, and coroutine cancellation is not an application failure."""
rationale = """
One async application boundary permits loop-affine resources and async storage \
without duplicating the synchronous transactional ledger or extending \
database transactions across application effects."""
date = "2026-08-08"
check = "uv run pytest -q tests/pipeline/test_definitions.py tests/execution/test_async_workflow.py"

[[contracts]]
title = "Applications own workflow resources"
statement = """
Applications create and close workflow resources; the platform does not \
construct, resolve, or close storage, provider, or process clients."""
rationale = """
Resource owners know their client and shutdown semantics; the platform promises \
no event-loop or shutdown sequence."""
date = "2026-08-08"
check = "uv run pytest -q tests/execution/test_async_workflow.py -k 'loop_affine_resource'"

[[contracts]]
title = "Dispatcher transactions execute platform code only"
statement = """
Admission and run barrier transactions enqueue compact validated platform \
payloads without calling application code. Durable wrappers reconstruct typed \
payloads, call argument derivation and application workflows, and record either \
callback's non-cancellation exception as application failure. Argument derivation is \
deterministic, replay-safe, external-I/O-free, and bounded."""
rationale = """
Application callbacks inside dispatcher transactions lengthen lock time and a \
repeatable callback error can poison every pass. Moving them into durable \
execution bounds transaction work and records one attributable outcome."""
date = "2026-08-09"
check = "uv run pytest -q tests/admission/test_runner.py tests/execution/test_async_workflow.py -k 'serialized_platform_payload or args_for_failure'"

[[contracts]]
title = "Registration closes ordered membership"
statement = """
Before registration, a submission run declares its expected member count. A \
run with completion also declares its manifest reference and membership \
digest; a run without completion supplies both or neither. Bounded idempotent \
registration closes after normal stream exhaustion only when persisted \
membership has the declared count, contiguous ordinals, unique work items, \
and any declared digest. Closure freezes membership; matching closed replay \
returns the same closure receipt without consuming another member stream."""
rationale = """
Normal exhaustion and full validation distinguish a complete stream from a \
partial prefix. The digest binds closed membership to the application manifest \
without a member listing API or per-member outcome snapshot."""
date = "2026-08-08"
check = "uv run pytest -q tests/submission/test_stream.py -k 'interrupted_registration or closed_replay or digest or invalid_membership or database_mutation'"

[[contracts]]
title = "Registration is set-oriented"
statement = """
Each bounded registration chunk uses a fixed upper bound of database statement \
executions independent of member count and performs no per-member SQL. Closure \
may make one indexed ordered pass over the submission run's membership."""
rationale = """
Bounding transactions without bounding round trips still scales database \
latency with every member. Set-oriented chunk work preserves streaming and \
exact validation without serial query amplification."""
date = "2026-08-09"
check = "uv run pytest -q tests/submission/test_stream.py -k 'statement_count'"

[[contracts]]
title = "Membership is distinct from origin"
statement = """
Every submission run records its own membership edges, including edges to \
compatible work items created by another run. Origin records creation \
provenance only; it neither substitutes for membership nor authorizes inferred \
historical membership."""
rationale = """
Overlapping runs need independent complete member sets and correct counts for \
each submission run, while creation provenance must remain immutable and must \
not be reinterpreted as membership."""
date = "2026-08-08"
check = "uv run pytest -q tests/submission/test_stream.py tests/inspection/test_run_membership.py -k 'overlapping'"

[[contracts]]
title = "Work reuse preserves execution provenance"
statement = """
A run may reuse an existing campaign-and-work identity only when its pipeline \
key, pipeline version, and execution-configuration reference exactly match the \
work item's origin run. Different execution-defining facts require a different \
work identity."""
rationale = """
One work item has one stage execution history. Reusing that history under \
different execution facts would make its outcome ambiguous and allow a later \
run to silently reinterpret earlier work."""
date = "2026-08-08"
check = "uv run pytest -q tests/submission/test_stream.py -k 'execution_provenance'"

[[contracts]]
title = "Run inspection follows membership"
statement = """
Counts, status queries, and completion eligibility for a submission run derive \
through run membership rather than work origin. These reads remain bounded or \
aggregate; bulk run state counts use one aggregate query per bounded input \
chunk and distinguish missing from present empty runs without promising a \
general member listing API."""
rationale = """
Membership is the authoritative run scope, including for reused work. Keeping \
the first inspection surface narrow avoids embedding complete result sets in \
summaries or adding pagination before a caller requires it."""
date = "2026-08-08"
check = "uv run pytest -q tests/inspection/test_run_membership.py"

[[contracts]]
title = "Run barrier releases completion once"
statement = """
A closed submission run that declares completion releases once when every \
member's current stage execution is succeeded, failed, or cancelled. Release \
time and terminal state counts are immutable; later member transitions neither \
invalidate release nor create another completion execution."""
rationale = """
Terminality is durable platform evidence, while experiment acceptance remains \
application policy. Immutable edge-triggered release avoids cross-run retry \
fences, duplicate aggregate launch, and unrelated-backlog scans."""
date = "2026-08-08"
check = "uv run pytest -q tests/completion/test_run_barrier.py"

[[contracts]]
title = "Run completion is outside item pipelines"
statement = """
Run completion is one optional execution for a submission run after the \
members settle, not a pipeline stage or graph edge. Its payload contains the \
manifest reference, membership digest, and compact immutable release facts; \
applications resolve member results and own aggregate and acceptance \
semantics."""
rationale = """
Keeping fan-in beside the linear item pipeline adds a reusable completeness \
primitive without turning the platform into a graph engine or importing \
storage, provider, evaluation, or analysis policy."""
date = "2026-08-08"
check = "uv run pytest -q tests/pipeline/test_definitions.py tests/completion/test_run_execution.py -k 'completion'"

[[contracts]]
title = "Aggregate artifacts preserve consumed provenance"
statement = """
Before aggregation, the application validates that its immutable manifest \
contains the run completion payload's membership digest. Its immutable \
aggregate artifact records the exact member outcomes and output references \
consumed."""
rationale = """
Release facts can remain a compact edge-triggered snapshot while the aggregate \
stays reproducible after later member transitions, without platform-owned \
per-member snapshots or result listing."""
date = "2026-08-08"
check = "uv run pytest -q tests/completion/test_run_completion_dbos.py"

[[contracts]]
title = "Run completion records one outcome"
statement = """
Run completion uses one stable workflow identity. Enqueued means durably \
submitted without a recorded application outcome, not necessarily active; it \
may record at most one success or application failure. Success requires a \
non-empty output reference, failure means application failure only, and replay \
preserves identity."""
rationale = """
This provides truthful durable fan-in without retry, cancellation, controls, \
sweep, attempt history, or workflow runtime state projection."""
date = "2026-08-08"
check = "uv run pytest -q tests/completion/test_run_execution.py"
