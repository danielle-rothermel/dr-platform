# Proposed additions for the async-stages-and-run-fan-in plan. These contracts
# are discussion artifacts and are not yet binding repository contracts.

[[contracts]]
title = "Application workflows use one async boundary"
statement = """
Platform-managed item-stage and run-completion application workflows are \
coroutine functions awaited by platform-owned wrappers. Argument derivation \
remains synchronous and must not perform external I/O. Ledger mutation remains \
synchronous, and coroutine cancellation is not recorded as application \
failure."""
rationale = """
One async application boundary permits loop-affine resources and async storage \
without duplicating the synchronous transactional ledger or extending \
database transactions across application effects."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/pipeline/test_definitions.py tests/execution/test_async_workflow.py"

[[contracts]]
title = "Async resource lifecycle stays application-owned"
statement = """
Applications own the creation and closure of resources supplied to their \
workflows. The platform does not construct, resolve, or close application \
storage, provider, or process clients."""
rationale = """
Resource ownership must stay with the component that knows client semantics \
and shutdown requirements without making the platform promise a particular \
event-loop or shutdown sequence."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/execution/test_async_workflow.py -k 'resource_owner'"

[[contracts]]
title = "Run registration closes one ordered membership"
statement = """
A submission run declares its expected member count and opaque manifest \
reference before registration. Registration may resume in bounded idempotent \
chunks, but closes only when the persisted membership has the expected count, \
contiguous ordinals, and no duplicate work items; closure makes that ordered \
membership immutable."""
rationale = """
Explicit closure gives fan-in one complete persisted member set and rejects \
truncation or duplication without requiring callers and the platform to share \
a versioned whole-set identity recipe."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/submission/test_run_membership.py -k 'registration or ordinal or duplicate'"

[[contracts]]
title = "Membership and origin are independent facts"
statement = """
Every submission run records its own membership edges, including edges to \
compatible work items created by another run. Origin records creation \
provenance only; it neither substitutes for membership nor authorizes inferred \
historical membership."""
rationale = """
Overlapping runs need independent complete member sets and correct run-scoped \
counts, while creation provenance must remain immutable and unavailable \
historical relationships must not be invented."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/submission/test_run_membership.py -k 'overlapping or origin or migration'"

[[contracts]]
title = "Cross-run work reuse preserves execution provenance"
statement = """
A run may reuse an existing campaign-and-work identity only when its pipeline \
key, pipeline version, and execution-configuration reference exactly match the \
work item's origin run. Different execution-defining facts require a different \
work identity."""
rationale = """
One work item has one item-stage execution history. Reusing that history under \
different execution facts would make its outcome ambiguous and allow a later \
run to silently reinterpret earlier work."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/submission/test_run_membership.py -k 'compatible or provenance'"

[[contracts]]
title = "Run-scoped inspection follows membership"
statement = """
Run counts, status queries, and completion eligibility derive through exact run \
membership rather than work origin. These reads remain bounded or aggregate \
without promising a general member-listing API."""
rationale = """
Membership is the authoritative run scope, including for reused work. Keeping \
the first inspection surface narrow avoids embedding complete result sets in \
summaries or adding pagination before a caller requires it."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/inspection/test_run_membership.py"

[[contracts]]
title = "The run barrier projects terminal completeness once"
statement = """
A run whose registration is complete and that declares a run completion \
becomes eligible only after every exact member's current item stage is \
succeeded, failed, or cancelled. Reconciliation examines bounded pages, and \
persisted uniqueness prevents concurrent passes from creating duplicate run \
completion executions."""
rationale = """
Terminality is durable platform evidence, while experiment acceptance remains \
application policy. A bounded idempotent projection avoids polling races, \
duplicate aggregate launch, and unrelated-backlog scans."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/completion/test_run_barrier.py"

[[contracts]]
title = "Run completion is separate from item pipelines"
statement = """
Run completion is one optional run-scoped execution after the exact members \
settle, not an item stage or graph edge. Its payload contains compact immutable \
run facts; applications use their manifest and application-owned data to \
resolve member results and own aggregate and acceptance semantics."""
rationale = """
Keeping fan-in beside the linear item pipeline adds a reusable completeness \
primitive without turning the platform into a graph engine or importing \
storage, provider, evaluation, or analysis policy."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/pipeline/test_definitions.py tests/completion/test_run_payload.py"

[[contracts]]
title = "Run completion records one durable outcome"
statement = """
A run completion executes under one stable durable-workflow identity and \
records at most one terminal success or application-failure outcome. Success \
records one non-empty output reference, and durable-workflow replay preserves \
the same execution identity."""
rationale = """
This establishes durable fan-in without duplicating the item-stage operator \
lifecycle. Run-completion retry, cancellation, admission controls, abandonment \
sweep, and attempt-history inspection are not promised by this contract."""
date = "2026-08-08"
check = "planned: uv run pytest -q tests/completion/test_run_execution.py"
