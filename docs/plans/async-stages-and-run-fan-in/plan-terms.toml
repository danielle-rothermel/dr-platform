#:schema ../../../.defs/terms.schema.json

# Proposed additions for the async-stages-and-run-fan-in plan. These terms are
# discussion artifacts and are not yet part of the authoritative vocabulary.

[[terms]]
name = "run registration declaration"
definition = """
The immutable declaration fixing a submission run's expected member count and \
opaque manifest reference before registration."""
exported_symbols = ["RunRegistrationDeclaration"]
part_of = ["submission run"]

[[terms]]
name = "run member"
definition = """
One work item's ordered inclusion in a submission run, binding it to one \
ordinal independently of its origin run."""
exported_symbols = ["RunMemberInput"]
part_of = ["run membership"]

[[terms]]
name = "run membership"
definition = """
A submission run's ordered member set, append-only during registration and \
immutable after closure. Work appears at most once per run but may belong to \
multiple compatible runs."""
part_of = ["submission run"]

[[terms]]
name = "run barrier"
definition = """
The eligibility boundary satisfied when registration is complete and every \
member's current item stage is terminal, regardless of outcome or domain \
acceptance."""
part_of = ["submission run"]

[[terms]]
name = "run completion"
definition = """
An optional pipeline-declared durable run-level operation eligible after the \
run barrier. It is neither an item stage nor a graph node."""
exported_symbols = ["RunCompletionDefinition"]
part_of = ["pipeline definition"]

[[terms]]
name = "run completion execution"
definition = """
The sole durable execution of a run completion for one submission run, \
identified by a stable workflow identity."""
part_of = ["run completion", "submission run"]

[[terms]]
name = "run completion payload"
definition = """
The compact immutable run and terminal-count facts used to derive run-\
completion arguments; it neither contains nor resolves application-owned \
member outputs."""
exported_symbols = ["RunCompletionPayload"]
part_of = ["run completion execution"]
